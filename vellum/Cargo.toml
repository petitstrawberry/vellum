[package]
name = "vellum"
version = "0.1.0"
edition = "2024"
description = "A pure-Rust image and PDF viewer with ScarletUI frontends"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:scarlet-ui", "dep:scarlet-ui-macros"]

[dependencies]
vellum-core = { path = "../vellum-core" }

scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "1b0f08aeb0a7057c9a6d0d7312554372411afff8", package = "scarlet-ui-macros", optional = true }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "d3b1c05127d4df3616f988b81a99f616e8a88064", package = "scarlet-os" }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "1b0f08aeb0a7057c9a6d0d7312554372411afff8", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"], optional = true }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "1b0f08aeb0a7057c9a6d0d7312554372411afff8", package = "scarlet-ui", default-features = false, features = ["std", "platform-winit"], optional = true }

[[bin]]
name = "vellum"
path = "src/main.rs"
