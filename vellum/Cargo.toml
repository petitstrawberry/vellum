[package]
name = "vellum"
version = "0.1.0"
edition = "2024"
description = "A pure-Rust image and PDF viewer with ScarletUI frontends"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:scarlet-ui", "dep:scarlet-ui-macros"]

[dependencies]
vellum-core = { path = "../vellum-core" }

scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "6dbc9d87563d7d1dba529f04e7fbdfc850ca6ab6", package = "scarlet-ui-macros", optional = true }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", package = "scarlet-os" }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "6dbc9d87563d7d1dba529f04e7fbdfc850ca6ab6", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"], optional = true }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "6dbc9d87563d7d1dba529f04e7fbdfc850ca6ab6", package = "scarlet-ui", default-features = false, features = ["std", "platform-winit"], optional = true }

[[bin]]
name = "vellum"
path = "src/main.rs"
