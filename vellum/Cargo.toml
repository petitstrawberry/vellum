[package]
name = "vellum"
version = "0.1.0"
edition = "2024"
description = "A pure-Rust image and PDF viewer for host systems and Scarlet OS"
license = "MIT OR Apache-2.0"

[features]
default = ["gui"]
gui = ["dep:scarlet-ui", "dep:scarlet-ui-macros"]

[dependencies]
vellum-core = { path = "../vellum-core" }

scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", package = "scarlet-ui-macros", optional = true }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", branch = "dev", package = "scarlet-os" }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"], optional = true }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", package = "scarlet-ui", default-features = false, features = ["std", "platform-winit"], optional = true }

[[bin]]
name = "vellum"
path = "src/main.rs"
