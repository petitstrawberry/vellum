[package]
name = "vellum-core"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust image and PDF loading and rasterization core for Vellum"
license = "MIT"

[dependencies]
hayro = { version = "0.7.1", default-features = true }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "qoi",
    "tga",
    "webp",
] }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", package = "scarlet-sys" }
scarlet-abi = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", package = "scarlet-abi" }
